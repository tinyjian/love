<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff8fab" />
    <meta name="description" content="给怡宝的一份爱心礼物" />
    <meta property="og:title" content="给怡宝的秘密礼物" />
    <meta property="og:description" content="我为你准备了一份爱心礼物" />
    <meta property="og:type" content="website" />
    <title>爱心礼物</title>
    <link rel="modulepreload" href="./assets/three.module.js" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💝%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --bg-color: #fbe3ea;
        --card-font: "PingFang SC", "Microsoft YaHei", sans-serif;
        --safe-right: max(16px, env(safe-area-inset-right));
        --safe-bottom: max(16px, env(safe-area-inset-bottom));
        --safe-top: max(18px, env(safe-area-inset-top));
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: var(--card-font);
        background-color: var(--bg-color);
        background-image: linear-gradient(165deg, #ffeff3 0%, #ffd1e0 35%, #fbc2eb 100%);
      }

      body::before {
        content: "";
        position: absolute;
        inset: -10%;
        background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.92), transparent 55%),
          radial-gradient(circle at 80% 30%, rgba(255, 179, 214, 0.55), transparent 60%),
          radial-gradient(circle at 50% 85%, rgba(255, 200, 223, 0.5), transparent 65%);
        z-index: 0;
        pointer-events: none;
      }

      .floating-hearts {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .heart {
        position: absolute;
        bottom: -8%;
        color: #ff6b9c;
        font-size: 24px;
        opacity: 0;
        animation: float var(--dur, 6.4s) ease-in-out var(--delay, 0s) infinite;
      }

      @keyframes float {
        0% {
          opacity: 0;
          transform: translate3d(0, 20vh, 0) scale(0.6) rotate(0deg);
        }
        15%,
        80% {
          opacity: 0.85;
        }
        100% {
          opacity: 0;
          transform: translate3d(0, -110vh, 0) scale(1.12) rotate(360deg);
        }
      }

      .experience {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        z-index: 2;
      }

      .stage-hint {
        position: absolute;
        top: var(--safe-top);
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        width: min(520px, calc(100% - 32px));
        text-align: center;
        color: #c45d7a;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
        pointer-events: none;
        opacity: 0;
        transition: opacity 480ms ease;
      }

      .stage-hint.is-visible {
        opacity: 1;
      }

      .stage-hint strong {
        display: block;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.12em;
      }

      .stage-hint span {
        display: block;
        margin-top: 6px;
        font-size: 13px;
        opacity: 0.78;
      }

      .cards {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }

      .popup {
        font-family: inherit;
        text-align: center;
        padding: 0;
        cursor: pointer;
        pointer-events: auto;
        position: absolute;
        left: 0;
        top: 0;
        width: 148px;
        height: 64px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid rgba(255, 164, 194, 0.45);
        box-shadow: 0 6px 18px rgba(255, 105, 135, 0.28);
        font-size: 12px;
        line-height: 1.3;
        user-select: none;
        transform-origin: center;
        scale: var(--card-scale, 1);
        opacity: 0;
      }

      .popup-header {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 6px;
        background: #fce4ec;
        border-bottom: 1px solid #f8bbd0;
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 700;
        color: #d4537a;
        white-space: nowrap;
      }

      .popup-body {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3px 6px;
        text-align: center;
        font-weight: 700;
        color: #6d3348;
        overflow: hidden;
      }

      .popup-body span {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        text-overflow: ellipsis;
        word-break: break-word;
        line-height: 1.25;
        max-height: 2.5em;
      }

      .popup.theme-pink .popup-header {
        background: #fce4ec;
      }
      .popup.theme-pink .popup-body {
        background: #fff5f8;
      }
      .popup.theme-rose .popup-header {
        background: #ffe4e8;
      }
      .popup.theme-rose .popup-body {
        background: #fff7f8;
      }
      .popup.theme-lavender .popup-header {
        background: #f3e5f5;
      }
      .popup.theme-lavender .popup-body {
        background: #faf5fc;
      }
      .popup.theme-peach .popup-header {
        background: #ffe8dc;
      }
      .popup.theme-peach .popup-body {
        background: #fff8f3;
      }
      .popup.theme-coral .popup-header {
        background: #ffddd8;
      }
      .popup.theme-coral .popup-body {
        background: #fff6f5;
      }

      @keyframes heart-fly-in {
        0% {
          opacity: 0;
          left: var(--start-left);
          top: var(--final-top);
          transform: scale(0.35) rotate(var(--rotation, 0deg));
        }
        22% {
          opacity: 1;
          left: var(--final-left);
          top: var(--final-top);
          transform: scale(1.16) rotate(var(--rotation, 0deg));
        }
        72% {
          opacity: 1;
          left: var(--final-left);
          top: var(--final-top);
          transform: scale(1.16) rotate(var(--rotation, 0deg));
        }
        100% {
          opacity: 1;
          left: var(--final-left);
          top: var(--final-top);
          transform: scale(1) rotate(var(--rotation, 0deg));
        }
      }

      .popup.heart-anim {
        animation: heart-fly-in 3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(255, 154, 185, 0.32);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(6px);
        z-index: 10;
        opacity: 1;
        transition: opacity 320ms ease;
      }

      .modal-backdrop.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .modal {
        width: min(420px, 80vw);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 36px 90px rgba(255, 110, 170, 0.25);
        padding: 28px 32px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .modal-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .modal-icon {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: linear-gradient(135deg, #ff6b9c, #ff8fab);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 20px;
      }

      .modal-title {
        font-size: 22px;
        font-weight: 600;
        color: #7a3a52;
      }

      .modal-body {
        font-size: 16px;
        line-height: 1.6;
        color: #a05370;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }

      .btn-primary,
      .music-toggle {
        border: none;
        cursor: pointer;
        color: #fff;
        touch-action: manipulation;
        background: linear-gradient(135deg, #ff6b9c, #ff8fab);
      }

      .btn-primary {
        padding: 10px 22px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 500;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 28px rgba(255, 110, 170, 0.3);
      }

      .btn-primary:active {
        transform: translateY(1px);
      }

      .btn-primary:focus-visible,
      .music-toggle:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      .music-toggle {
        position: fixed;
        right: var(--safe-right);
        bottom: var(--safe-bottom);
        z-index: 50;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-size: 18px;
        box-shadow: 0 10px 24px rgba(255, 110, 170, 0.28);
      }

      .music-toggle[hidden] {
        display: none;
      }

      @media (max-width: 375px) {
        .popup {
          width: 102px;
          height: 52px;
        }
        .popup-header {
          font-size: 8px;
          padding: 2px 4px;
        }
        .popup-body {
          font-size: 10px;
          padding: 2px 4px;
        }
      }

      @media (min-width: 376px) and (max-width: 480px) {
        .popup {
          width: 118px;
          height: 56px;
        }
        .popup-body {
          font-size: 11px;
        }
      }

      @media (min-width: 481px) and (max-width: 640px) {
        .popup {
          width: 132px;
          height: 58px;
        }
        .popup-body {
          font-size: 12px;
        }
      }

      @media (min-width: 769px) and (max-width: 1024px) {
        .popup {
          width: 158px;
          height: 66px;
        }
        .popup-body {
          font-size: 13px;
        }
      }

      @media (min-width: 1025px) {
        .popup {
          width: 176px;
          height: 70px;
        }
        .popup-header {
          font-size: 11px;
        }
        .popup-body {
          font-size: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .heart {
          animation: none;
          display: none;
        }
        .popup.heart-anim {
          animation: none;
          opacity: 1;
          left: var(--final-left);
          top: var(--final-top);
          transform: rotate(var(--rotation, 0deg));
        }
      }
      .gift-stage {
        position: fixed;
        inset: 0;
        z-index: 30;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 48%, #4b1649 0%, #190d29 48%, #080611 100%);
        opacity: 0;
        transition: opacity 650ms ease;
        pointer-events: none;
      }
      .gift-stage[hidden] { display: none; }
      .gift-stage.is-active { opacity: 1; pointer-events: auto; }
      .gift-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .gift-3d { opacity: 0; }
      .gift-stage.use-3d .gift-3d { animation: gift-3d-fade 6.5s ease both; }
      .gift-stage.use-3d .gift-emblem { display: none; }
      @keyframes gift-3d-fade { 0% { opacity: 0; } 8%, 86% { opacity: 1; } 100% { opacity: 0; } }
      .gift-aura {
        position: absolute; left: 50%; top: 45%; width: min(80vw, 580px); aspect-ratio: 1;
        border-radius: 50%; transform: translate(-50%, -50%);
        background: radial-gradient(circle, #ff75b838, #ffb57012 45%, transparent 70%);
        animation: gift-aura 2s ease-in-out infinite alternate;
      }
      .gift-emblem {
        position: absolute; left: 50%; top: 44%; width: min(78vw, 480px);
        transform: translate(-50%, -50%); opacity: 0;
      }
      .is-active .gift-emblem { animation: gift-arrive 6.5s ease both; }
      .gift-emblem svg { display: block; width: 100%; overflow: visible; }
      .gift-core { transform-origin: 240px 210px; animation: gift-beat 1.2s ease-in-out infinite; }
      .gift-ring { transform-origin: 240px 230px; animation: gift-ring 5s linear infinite; }
      .gift-copy {
        position: absolute; top: 69%; left: 16px; right: 16px; text-align: center;
        color: #fff1dc; opacity: 0;
      }
      .is-active .gift-copy { animation: gift-caption 6.5s ease both; }
      .gift-copy small { display: block; font-size: 10px; letter-spacing: .42em; color: #eab4cd; }
      .gift-copy h1 { margin: 14px 0 10px; font-size: clamp(23px, 5vw, 38px); font-weight: 500; letter-spacing: .12em; text-shadow: 0 0 24px #ff80b5; }
      .gift-copy p { font-size: 13px; letter-spacing: .18em; color: #edc2d5; }
      .gift-skip {
        position: absolute; right: var(--safe-right); top: var(--safe-top);
        border: 1px solid #ffffff35; border-radius: 24px; padding: 9px 16px;
        background: #ffffff0d; color: #f7dfeb; cursor: pointer;
      }
      .gift-replay {
        position: fixed; bottom: var(--safe-bottom); left: 16px; z-index: 9;
        border: 1px solid #ffffffb0; border-radius: 24px; padding: 12px 18px;
        color: #a83e68; background: #fff1f5e6; box-shadow: 0 6px 24px #db66832b;
        font: inherit; font-size: 13px; cursor: pointer;
      }
      .gift-replay[hidden] { display: none; }
      .popup:focus-visible { outline: 3px solid #ba4774; outline-offset: 3px; z-index: 500 !important; }
      .popup:hover { box-shadow: 0 8px 28px #c34c7a70; }
      .letter-dialog {
        margin: auto; width: min(400px, calc(100% - 40px)); padding: 32px 26px;
        border: 1px solid #fff; border-radius: 24px; background: #fff5f8;
        color: #873951; box-shadow: 0 24px 100px #84214340; text-align: center;
      }
      .letter-dialog::backdrop { background: #44213766; backdrop-filter: blur(8px); }
      .letter-dialog small { color: #bc708b; letter-spacing: .16em; }
      .letter-dialog h2 { font-size: 20px; margin: 16px 0; }
      .letter-dialog p { font-size: 20px; line-height: 1.9; margin: 24px 0 30px; overflow-wrap: anywhere; }
      .letter-dialog form { display: flex; justify-content: center; }
      .letter-dialog .btn-primary { min-height: 44px; }
      .gift-skip:focus-visible, .gift-replay:focus-visible { outline: 3px solid #e9a34e; outline-offset: 4px; }
      @keyframes gift-arrive {
        0%, 8% { opacity: 0; transform: translate(-50%, -45%) scale(.2) rotate(-12deg); }
        24% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(2deg); }
        34%, 84% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.16); }
      }
      @keyframes gift-caption { 0%, 28% { opacity: 0; transform: translateY(12px); } 40%, 86% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
      @keyframes gift-aura { to { opacity: .5; transform: translate(-50%, -50%) scale(1.2); } }
      @keyframes gift-beat { 50% { transform: scale(1.055); } }
      @keyframes gift-ring { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .gift-stage *, .is-active .gift-emblem, .is-active .gift-copy { animation: none; }
        .gift-stage, .popup { transition: none !important; }
        .is-active .gift-emblem, .is-active .gift-copy { opacity: 1; }
      }
      /* ---------- Finale ---------- */
      .finale {
        position: fixed; inset: 0; z-index: 40; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: var(--safe-top) 20px var(--safe-bottom); text-align: center; color: #fff1dc;
        background: radial-gradient(ellipse at 50% 40%, #3d1245 0%, #1a0d2b 50%, #07050f 100%);
        opacity: 0; transition: opacity 800ms ease;
      }
      .finale[hidden] { display: none; }
      .finale.is-active { opacity: 1; }
      .finale canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .finale-title { position: relative; z-index: 2; width: 100%; max-width: 560px; pointer-events: none; }
      .finale-title > *:not(.finale-btn) { opacity: 0; transform: translateY(14px); transition: opacity 1s ease, transform 1s ease; }
      .finale.show-title .finale-title > *:not(.finale-btn) { opacity: 1; transform: none; }
      .finale.show-title .finale-title > h1 { transition-delay: .25s; }
      .finale.show-title .finale-title > .finale-count { transition-delay: .6s; }
      .finale-title small { display: block; font-size: 11px; letter-spacing: .4em; color: #eab4cd; }
      .finale-title h1 {
        margin: 16px 0 0; font-size: clamp(26px, 7vw, 50px); font-weight: 500; letter-spacing: .1em; line-height: 1.4;
        background: linear-gradient(90deg, #fff3c9, #ff9fcb, #ffd7a8, #fff3c9); background-size: 300% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 18px #ff80b57a); animation: finale-shine 5s linear infinite;
      }
      @keyframes finale-shine { to { background-position: -300% 0; } }
      .finale-count { margin-top: 18px; font-size: 14px; letter-spacing: .08em; color: #f1c3d8; font-variant-numeric: tabular-nums; }
      .finale-count b { font-size: 1.25em; color: #ffe2b4; font-weight: 600; }
      .finale-btn {
        font: inherit; font-size: 15px; letter-spacing: .08em; cursor: pointer; color: #fff;
        padding: 13px 26px; border: 1px solid #ffffff55; border-radius: 28px;
        background: linear-gradient(135deg, #ff6b9c, #ff8fab); box-shadow: 0 8px 30px #ff6b9c66;
        touch-action: manipulation;
      }
      #openLetter { margin-top: 30px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .9s ease, transform .9s ease; }
      .finale.show-btn #openLetter { opacity: 1; transform: none; pointer-events: auto; animation: finale-pulse 1.8s ease-in-out infinite 1s; }
      .finale.is-final #openLetter { display: none; }
      @keyframes finale-pulse { 50% { box-shadow: 0 8px 44px #ff6b9cc0; transform: scale(1.04); } }
      .finale-btn:focus-visible { outline: 3px solid #e9a34e; outline-offset: 4px; }
      .finale.is-final { justify-content: flex-start; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: max(44px, var(--safe-top)); }
      .finale.is-final > * { flex-shrink: 0; }
      .finale canvas { position: fixed; }
      .photo-wall { position: relative; z-index: 2; width: min(1100px, 100%); margin-top: 34px; padding-bottom: 8px; }
      .photo-wall[hidden] { display: none; }
      .wall-tip { margin-bottom: 18px; font-size: 12px; letter-spacing: .3em; color: #eab4cd; }
      .wall-grid { column-count: 2; column-gap: 12px; text-align: left; }
      @media (min-width: 700px) { .wall-grid { column-count: 3; column-gap: 16px; } }
      @media (min-width: 1000px) { .wall-grid { column-count: 4; } }
      .wall-item {
        display: block; width: 100%; margin: 0 0 14px; padding: 6px 6px 8px; break-inside: avoid; cursor: zoom-in;
        font: inherit; border: 0; border-radius: 6px; background: #fff8f3; color: #a2506b;
        box-shadow: 0 10px 30px #0008, 0 0 24px #ff6b9c33; touch-action: manipulation;
        opacity: 0; transform: translateY(26px) rotate(var(--r, 0deg));
        transition: opacity .9s ease var(--d, 0s), transform .9s ease var(--d, 0s), box-shadow .3s ease;
      }
      .wall-item.is-in { opacity: 1; transform: rotate(var(--r, 0deg)); }
      .wall-item:hover, .wall-item:focus-visible { transform: rotate(0deg) scale(1.03); box-shadow: 0 16px 40px #000a, 0 0 36px #ff6b9c77; position: relative; z-index: 2; transition-delay: 0s; }
      .wall-item:focus-visible { outline: 3px solid #e9a34e; outline-offset: 3px; }
      .wall-item img { display: block; width: 100%; height: auto; min-height: 110px; border-radius: 3px; background: #f3d9e1; }
      .wall-item span { display: block; margin-top: 6px; text-align: center; font-size: 11px; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
      .finale-again {
        position: relative; z-index: 3; display: none; margin: 26px auto 8px;
        font: inherit; font-size: 12px; color: #f7dfeb; background: #ffffff12; border: 1px solid #ffffff30;
        border-radius: 20px; padding: 8px 14px; cursor: pointer;
      }
      .finale.is-final .finale-again { display: block; }
      .lightbox {
        position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
        background: #080410eb; backdrop-filter: blur(6px); opacity: 0; transition: opacity .3s ease; touch-action: pan-y;
      }
      .lightbox[hidden] { display: none; }
      .lightbox.is-on { opacity: 1; }
      .lb-fig { margin: 0; text-align: center; max-width: 100%; }
      .lb-fig img { display: block; max-width: min(94vw, 1400px); max-height: 82vh; max-height: 82dvh; margin: 0 auto; object-fit: contain; border-radius: 6px; box-shadow: 0 20px 80px #000; }
      .lb-fig figcaption { margin-top: 12px; font-size: 13px; letter-spacing: .2em; color: #f1c3d8; font-variant-numeric: tabular-nums; }
      .lb-btn {
        position: absolute; width: 46px; height: 46px; border: 1px solid #ffffff30; border-radius: 50%;
        background: #ffffff14; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; touch-action: manipulation;
      }
      .lb-btn:focus-visible { outline: 3px solid #e9a34e; outline-offset: 3px; }
      .lb-close { top: var(--safe-top); right: var(--safe-right); }
      .lb-prev { left: max(10px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); }
      .lb-next { right: max(10px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); }
      .finale-letter {
        position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
        background: #0a051acc; backdrop-filter: blur(6px); opacity: 0; transition: opacity .7s ease;
      }
      .finale-letter[hidden] { display: none; }
      .finale-letter.is-on { opacity: 1; }

        const minSide = Math.min(window.innerWidth, window.innerHeight);
        if (minSide < 520) return 42;

        return scored.slice(0, limit).map((item) => item.text);
      };

      const heartPointAt = (t) => {
        const sinT = Math.sin(t);
        return {
          x: 16 * sinT * sinT * sinT,
          y: -(
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t)
          ),
        };
      };

      const generateHeartPoints = (count) => {
        const sampleCount = Math.max(count * 8, 720);
        const samples = new Array(sampleCount);
        let totalLength = 0;
        let prev = null;

        for (let i = 0; i < sampleCount; i += 1) {
          const t = (i / (sampleCount - 1)) * Math.PI * 2;
          const point = heartPointAt(t);
          if (prev) totalLength += Math.hypot(point.x - prev.x, point.y - prev.y);
          samples[i] = { x: point.x, y: point.y, length: totalLength };
          prev = point;
        }

        if (count <= 1) {
          const mid = samples[Math.floor(samples.length / 2)];
          return [{ x: mid.x, y: mid.y }];
        }

        const points = new Array(count);
        const segmentLength = totalLength / count;
        let sampleIndex = 1;

        for (let i = 0; i < count; i += 1) {
          const targetLength = segmentLength * i;
          while (sampleIndex < samples.length && samples[sampleIndex].length < targetLength) {
            sampleIndex += 1;
          }

          const prevSample = samples[Math.max(0, sampleIndex - 1)];
          const nextSample = samples[Math.min(samples.length - 1, sampleIndex)];
          const span = nextSample.length - prevSample.length || 1;
          const ratio = Math.min(Math.max((targetLength - prevSample.length) / span, 0), 1);

          points[i] = {
            x: prevSample.x + (nextSample.x - prevSample.x) * ratio,
            y: prevSample.y + (nextSample.y - prevSample.y) * ratio,
          };
        }

        return points;
      };

        const finalLeft = width / 2 + point.x * scale - size.w / 2;
        const finalTop = height / 2 + (point.y - 2.5) * scale - size.h / 2;
        const fromRight = point.x >= 0;
        const startLeft = fromRight ? width + 80 : -size.w - 80;
        return { size, finalLeft, finalTop, startLeft, cardScale };

        const text = displayText(selectedPhrases[index]);
        const layout = getHeartLayout(heartPoints[index]);
        const rotation = `${randomRange(-3, 3).toFixed(1)}deg`;
        const popup = document.createElement("button");
        popup.type = "button";
        popup.setAttribute("aria-label", `读一读：${selectedPhrases[index]}`);
        popup.addEventListener("click", () => {
          letterText.textContent = selectedPhrases[index];
          letterDialog.showModal();
        });
        popup.className = `popup ${pick(THEMES)} heart-anim`;
        popup.style.zIndex = String(100 + index);
        popup.style.setProperty("--card-scale", layout.cardScale);
        popup.style.setProperty("--start-left", `${layout.startLeft}px`);
        popup.style.setProperty("--final-left", `${layout.finalLeft}px`);
        popup.style.setProperty("--final-top", `${layout.finalTop}px`);
        popup.style.setProperty("--rotation", rotation);

        const header = document.createElement("span");
        header.className = "popup-header";
        const icon = document.createElement("span");
        icon.textContent = "💝";
        const title = document.createElement("span");
        title.textContent = "给怡宝的话";
        header.append(icon, title);

        const body = document.createElement("span");
        body.className = "popup-body";
        const line = document.createElement("span");
        line.textContent = text;
        body.appendChild(line);

        popup.append(header, body);
        cardsContainer.appendChild(popup);
      };

      const freezePopup = (popup) => {
        const style = window.getComputedStyle(popup);
        const left = style.left, top = style.top, transform = style.transform;
        popup.style.animation = "none";
        popup.style.opacity = "1";
        popup.style.left = left;
        popup.style.top = top;
        popup.style.transform = transform;
      };

      const gatherThenScatter = () => {
        const popups = Array.from(cardsContainer.children);
        const { innerWidth: width, innerHeight: height } = window;
        const size = getPopupSize();
        setHint("先收进心里，再轻轻散开");
        popups.forEach((popup, index) => {
          setTimeout(() => {
            freezePopup(popup);
            // Commit the current position before transitioning to the center.
            void popup.offsetWidth;
            popup.style.transition = "all 1s cubic-bezier(0.4, 0, 0.2, 1)";
            popup.style.left = `${width / 2 - size.w / 2}px`;
            popup.style.top = `${height / 2 - size.h / 2}px`;
            popup.style.zIndex = String(1000 + index);
            popup.style.transform = "scale(1) rotate(0deg)";
          }, index * TIMING.gatherGap);
        });
        // Once everything has gathered at the centre, burst into the finale.
        setTimeout(startFinale, popups.length * TIMING.gatherGap + 1300);
      };

      window.addEventListener("resize", () => {
        if (!hasStarted || !heartPoints.length) return;
        Array.from(cardsContainer.children).forEach((popup, index) => {
          const layout = getHeartLayout(heartPoints[index]);
          popup.style.setProperty("--final-left", `${layout.finalLeft}px`);
          popup.style.setProperty("--final-top", `${layout.finalTop}px`);
          popup.style.setProperty("--card-scale", layout.cardScale);
        });
      });

      const startHeart = () => {
        selectedPhrases = pickPhrases(getPhraseLimit());
        heartPoints = generateHeartPoints(selectedPhrases.length);
        spawnIndex = 0;
        setHint("从最上边开始，一句一句拼成心");

        if (prefersReducedMotion) {
          selectedPhrases.forEach((_, index) => spawnPopup(index));
          setHint("轻点卡片，读一读我的心意");
          return;
        }

        spawnTimer = setInterval(() => {
          spawnPopup(spawnIndex);
          spawnIndex += 1;
          if (spawnIndex >= selectedPhrases.length) {
            clearInterval(spawnTimer);
            spawnTimer = null;
            setTimeout(gatherThenScatter, TIMING.flyDuration + TIMING.heartHold);
          }
        }, TIMING.spawnGap);
      };

      const giftStage = document.getElementById("giftStage");
      const giftCanvas = document.getElementById("giftCanvas");
      const giftSkip = document.getElementById("giftSkip");
      const giftReplay = document.getElementById("giftReplay");
      const giftContext = giftCanvas.getContext("2d");
      let giftFrame = null;
      let giftTimer = null;
      let giftDone = null;
      let giftParticles = [];
      let giftStars = [];
      let giftWidth = 0;
      let giftHeight = 0;
      let giftStartedAt = 0;
      let giftLastFrame = 0;
      let giftBurst = 0;

      // ---------- Three.js 3D heart (progressive enhancement, falls back to SVG) ----------
      const THREE_URL = "./assets/three.module.js";
      const gift3d = document.getElementById("gift3d");
      let THREE = null;
      let three = null;
      let threeFrame = null;
      const pointer3d = { x: 0, y: 0 };
      // Preload the library while the user is still reading the opening dialog.
      const threePromise = import(THREE_URL)
        .then((mod) => (THREE = mod))
        .catch(() => null);

      const makeSpriteTexture = (inner, outer) => {
        const c = document.createElement("canvas");
        c.width = c.height = 64;
        const g = c.getContext("2d");
        const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, inner);
        grad.addColorStop(1, outer);
        g.fillStyle = grad;
        g.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
      };

      const build3D = () => {
        const renderer = new THREE.WebGLRenderer({
          canvas: gift3d, alpha: true, antialias: true, powerPreference: "high-performance",
        });
        renderer.setClearColor(0x000000, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        const isSmall = Math.min(window.innerWidth, window.innerHeight) < 600;
        const maxRatio = isSmall ? 1.75 : 2;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxRatio));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, 1, 1, 300);
        camera.position.set(0, 0, 80);

        scene.add(new THREE.HemisphereLight(0xffd6e8, 0x5a1a4a, 0.9));
        const key = new THREE.DirectionalLight(0xffffff, 2.6);
        key.position.set(30, 40, 60);
        const rim = new THREE.DirectionalLight(0xff7ab8, 2.2);
        rim.position.set(-50, -10, -30);
        const fill = new THREE.DirectionalLight(0xffc98a, 1.1);
        fill.position.set(-30, 20, 40);
        scene.add(key, rim, fill);

        const shape = new THREE.Shape();
        const steps = 128;
        for (let i = 0; i <= steps; i += 1) {
          const p = heartPointAt((i / steps) * Math.PI * 2);
          if (i) shape.lineTo(p.x, -p.y); else shape.moveTo(p.x, -p.y);
        }
        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 5, bevelEnabled: true, bevelThickness: 3.2, bevelSize: 2.6, bevelSegments: 8, curveSegments: steps,
        });
        geometry.center();
        geometry.computeBoundingBox();
        const baseWidth = geometry.boundingBox.max.x - geometry.boundingBox.min.x;
        const material = new THREE.MeshPhysicalMaterial({
          color: 0xff3f8e, metalness: 0.2, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.12,
          emissive: 0xb3124f, emissiveIntensity: 0.6,
        });
        const heart = new THREE.Mesh(geometry, material);

        const glow = new THREE.Sprite(new THREE.SpriteMaterial({
          map: makeSpriteTexture("rgba(255,140,200,0.85)", "rgba(255,140,200,0)"),
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        }));
        glow.scale.set(baseWidth * 2.3, baseWidth * 2.3, 1);
        glow.position.z = -8;

        const count = isSmall ? 900 : 1800;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const palette = [new THREE.Color(0xffe5ae), new THREE.Color(0xff9dce), new THREE.Color(0xfff4e2), new THREE.Color(0xec7dbe)];
        const startPos = new Float32Array(count * 3);
        const heartPos = new Float32Array(count * 3);
        const ringPos = new Float32Array(count * 3);
        const delays = new Float32Array(count);
        // Vertical centre of the heart outline so the particle cloud lines up with the solid mesh.
        let minY = Infinity, maxY = -Infinity;
        for (let i = 0; i <= 90; i += 1) {
          const y = -heartPointAt((i / 90) * Math.PI * 2).y;
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
        const centerY = (minY + maxY) / 2;
        for (let i = 0; i < count; i += 1) {
          // Orbit ring target (final resting place).
          const ring = i < count * 0.7;
          const a = Math.random() * Math.PI * 2;
          const r = ring ? randomRange(23, 31) : randomRange(18, 55);
          const spread = ring ? randomRange(-3.5, 3.5) : randomRange(-30, 30);
          ringPos[i * 3] = Math.cos(a) * r;
          ringPos[i * 3 + 1] = spread;
          ringPos[i * 3 + 2] = Math.sin(a) * r;
          // Heart-shaped target: 60% on the outline, 40% filling the inside.
          const hp = heartPointAt(Math.random() * Math.PI * 2);
          const k = Math.random() < 0.6 ? randomRange(0.97, 1.03) : Math.sqrt(Math.random()) * 0.92;
          heartPos[i * 3] = hp.x * k * 1.1;
          heartPos[i * 3 + 1] = (-hp.y - centerY) * k * 1.1;
          heartPos[i * 3 + 2] = randomRange(-5, 5);
          // Scattered start somewhere far away on a sphere shell.
          const u = Math.random() * 2 - 1, phi = Math.random() * Math.PI * 2;
          const sr = randomRange(70, 130), sq = Math.sqrt(1 - u * u);
          startPos[i * 3] = Math.cos(phi) * sq * sr;
          startPos[i * 3 + 1] = u * sr;
          startPos[i * 3 + 2] = Math.sin(phi) * sq * sr;
          delays[i] = Math.random();
          positions.set(startPos.subarray(i * 3, i * 3 + 3), i * 3);
          const c = pick(palette);
          colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
        }
        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        pGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
        const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
          size: 1.5, map: makeSpriteTexture("rgba(255,255,255,1)", "rgba(255,255,255,0)"),
          vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        }));
        particles.frustumCulled = false;

        const root = new THREE.Group();
        root.add(glow, heart, particles);
        scene.add(root);

        three = { renderer, scene, camera, root, heart, glow, particles, baseWidth, count, maxRatio,
          positions, startPos, heartPos, ringPos, delays,
          frames: 0, slow: 0, spinY: 0, spinX: 0 };
      };

      const resize3D = () => {
        if (!three) return;
        const { renderer, camera, root, baseWidth, maxRatio } = three;
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxRatio));
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        const worldPerPx = (2 * camera.position.z * Math.tan((camera.fov * Math.PI) / 360)) / h;
        const targetPx = Math.min(w * 0.5, h * 0.34, 340);
        root.scale.setScalar((targetPx * worldPerPx) / baseWidth);
        root.position.y = (0.5 - 0.44) * h * worldPerPx;
      };

      const render3D = (now) => {
        if (!three) return;
        const s = three;
        const t = (now - giftStartedAt) / 1000;
        // Timeline: 0.1-2.0s particles converge into a heart cloud, 1.9-3.2s solid heart
        // fades in, 3.4-5.0s particles release into the orbit ring.
        const p = Math.min(Math.max((t - 1.9) / 1.3, 0), 1);
        const c1 = 1.70158, c3 = c1 + 1;
        const ease = 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); // easeOutBack
        const beat = Math.pow(Math.max(0, Math.sin(t * 5.2)), 8) * 0.07 + Math.pow(Math.max(0, Math.sin(t * 5.2 - 0.9)), 8) * 0.035;
        s.heart.scale.setScalar(Math.max(0.0001, ease * (1 + beat)));
        s.spinY += (pointer3d.x * 0.6 - s.spinY) * 0.06;
        s.spinX += (pointer3d.y * 0.35 - s.spinX) * 0.06;
        s.heart.rotation.y = Math.sin(t * 0.9) * 0.6 - (1 - p) * Math.PI * 2 + s.spinY;
        s.heart.rotation.x = Math.sin(t * 0.7) * 0.08 + s.spinX;
        s.glow.material.opacity = (0.55 + beat * 4) * Math.min(1, t / 2.2);
        s.glow.scale.setScalar(s.baseWidth * (2.1 + beat * 3));
        const pos = s.positions;
        const clamp01 = (v) => Math.min(Math.max(v, 0), 1);
        const pulse = 1 + beat * 1.2;
        for (let i = 0; i < s.count; i += 1) {
          const d = s.delays[i], j = i * 3;
          const gather = 1 - Math.pow(1 - clamp01((t - 0.1 - d * 0.9) / 1.0), 3); // easeOutCubic
          const rr = clamp01((t - 3.4 - d * 0.8) / 1.2);
          const release = rr < 0.5 ? 4 * rr * rr * rr : 1 - Math.pow(-2 * rr + 2, 3) / 2; // easeInOutCubic
          for (let k = 0; k < 3; k += 1) {
            const h = (s.startPos[j + k] + (s.heartPos[j + k] - s.startPos[j + k]) * gather);
            const hp = k === 2 ? h : h * (gather >= 1 ? pulse : 1);
            pos[j + k] = hp + (s.ringPos[j + k] - hp) * release;
          }
        }
        s.particles.geometry.attributes.position.needsUpdate = true;
        const relAll = clamp01((t - 3.4) / 1.6);
        s.particles.rotation.y = (Math.sin(t * 0.9) * 0.6 + s.spinY) * (1 - relAll) + 0.28 * Math.max(0, t - 3.4) * relAll;
        s.particles.rotation.x = (Math.sin(t * 0.7) * 0.08 + s.spinX) * (1 - relAll);
        s.particles.rotation.z = 0.35 * relAll;
        s.particles.material.opacity = Math.min(1, t / 0.4);
        s.renderer.render(s.scene, s.camera);

        // Adaptive quality: if the first frames are slow, drop resolution and particles.
        s.frames += 1;
        if (s.frames > 20 && s.frames <= 90) {
          if (now - s.last > 34) s.slow += 1;
          if (s.frames === 90 && s.slow > 30) {
            s.maxRatio = 1;
            resize3D();
            s.particles.geometry.setDrawRange(0, Math.floor(s.count / 2));
          }
        }
        s.last = now;
        threeFrame = requestAnimationFrame(render3D);
      };

      const start3D = () => {
        if (prefersReducedMotion || !THREE || giftStage.hidden || threeFrame) return;
        try {
          if (!three) build3D();
          three.frames = 0; three.slow = 0; three.last = performance.now();
          giftStage.classList.add("use-3d");
          resize3D();
          threeFrame = requestAnimationFrame(render3D);
        } catch (err) {
          three = null;
          giftStage.classList.remove("use-3d");
        }
      };

      const stop3D = () => {
        cancelAnimationFrame(threeFrame);
        threeFrame = null;
        giftStage.classList.remove("use-3d");
      };

      giftStage.addEventListener("pointermove", (event) => {
        pointer3d.x = (event.clientX / window.innerWidth - 0.5) * 2;
        pointer3d.y = (event.clientY / window.innerHeight - 0.5) * 2;
      });

      const resizeGift = () => {
        giftWidth = window.innerWidth;
        giftHeight = window.innerHeight;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        giftCanvas.width = Math.round(giftWidth * ratio);
        giftCanvas.height = Math.round(giftHeight * ratio);
        if (giftContext) giftContext.setTransform(ratio, 0, 0, ratio, 0, 0);
        giftStars = Array.from({ length: giftWidth < 600 ? 65 : 115 }, () => ({
          x: Math.random() * giftWidth, y: Math.random() * giftHeight,
          size: randomRange(.5, 1.6), phase: randomRange(0, Math.PI * 2),
        }));
        resize3D();
      };

      const burstGift = (x, y, count, heartShape = false) => {
        for (let i = 0; i < count; i += 1) {
          const angle = i / count * Math.PI * 2;
          const point = heartShape ? heartPointAt(angle) : { x: Math.cos(angle) * 14, y: Math.sin(angle) * 14 };
          const speed = randomRange(.7, 1.3);
          giftParticles.push({ x, y, vx: point.x * speed * 10, vy: point.y * speed * 10,
            life: 0, maxLife: randomRange(1.1, 1.9), size: randomRange(1, 2.7),
            color: pick(["#ffe5ae", "#ff9dce", "#fff4e2", "#ec7dbe"]) });
        }
      };

      const drawGift = (now) => {
        if (giftStage.hidden || !giftContext) return;
        const elapsed = (now - giftStartedAt) / 1000;
        const delta = Math.min((now - giftLastFrame) / 1000 || .016, .04);
        giftLastFrame = now;
        const ctx = giftContext;
        ctx.clearRect(0, 0, giftWidth, giftHeight);
        giftStars.forEach((star) => {
          ctx.globalAlpha = .25 + (Math.sin(elapsed * 1.8 + star.phase) + 1) * .3;
          ctx.fillStyle = "#ffe8df";
          ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "lighter";
        if (elapsed < 1.5) {
          const progress = Math.min(elapsed / 1.25, 1);
          const startX = giftWidth * .05, startY = giftHeight * .12;
          const endX = giftWidth * .5, endY = giftHeight * .44;
          for (let i = 0; i < 30; i += 1) {
            const t = Math.max(0, progress - i * .012);
            const x = startX + (endX - startX) * t;
            const y = startY + (endY - startY) * t * t;
            ctx.globalAlpha = (1 - i / 30) * Math.min(1, (1.5 - elapsed) * 4);
            ctx.fillStyle = i < 3 ? "#fff6df" : "#ff9ccf";
            ctx.beginPath(); ctx.arc(x, y, Math.max(.5, 4 - i * .12), 0, Math.PI * 2); ctx.fill();
          }
        }
        const burstTimes = [1.25, 2.5, 3.4, 4.3, 5.2];
        if (giftBurst < burstTimes.length && elapsed >= burstTimes[giftBurst]) {
          const first = giftBurst === 0;
          burstGift(first ? giftWidth / 2 : giftWidth * (giftBurst % 2 ? .23 : .77),
            first ? giftHeight * .44 : giftHeight * (.23 + (giftBurst % 3) * .12),
            giftWidth < 600 ? 48 : 80, !first);
          giftBurst += 1;
        }
        if (elapsed > 1.25 && elapsed < 2.8) {
          const radius = (elapsed - 1.25) * Math.min(giftWidth, giftHeight) * .6;
          ctx.globalAlpha = Math.max(0, 1 - (elapsed - 1.25) / 1.55) * .6;
          ctx.strokeStyle = "#ffc59f"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(giftWidth / 2, giftHeight * .44, radius, 0, Math.PI * 2); ctx.stroke();
        }
        giftParticles = giftParticles.filter((particle) => particle.life < particle.maxLife);
        giftParticles.forEach((particle) => {
          particle.life += delta;
          particle.x += particle.vx * delta; particle.y += particle.vy * delta;
          particle.vy += 24 * delta;
          ctx.globalAlpha = Math.max(0, 1 - particle.life / particle.maxLife);
          ctx.fillStyle = particle.color;
          ctx.beginPath(); ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
        giftFrame = requestAnimationFrame(drawGift);
      };

      const finishGift = () => {
        if (!giftDone) return;
        const callback = giftDone;
        giftDone = null;
        clearTimeout(giftTimer);
        cancelAnimationFrame(giftFrame);
        giftStage.classList.remove("is-active");
        window.removeEventListener("resize", resizeGift);
        setTimeout(() => {
          stop3D();
          giftStage.hidden = true;
          giftParticles = [];
          giftReplay.hidden = false;
          callback();
          giftReplay.focus({ preventScroll: true });
        }, prefersReducedMotion ? 0 : 650);
      };

      const playGift = (callback = () => {}) => {
        if (!giftStage.hidden) return;
        giftReplay.hidden = true;
        musicToggle.hidden = true;
        giftDone = () => { musicToggle.hidden = false; callback(); };
        giftStage.hidden = false;
        resizeGift();
        window.addEventListener("resize", resizeGift);
        giftBurst = 0;
        giftParticles = [];
        giftStartedAt = performance.now();
        giftLastFrame = giftStartedAt;
        // Flush the initial state so replays restart the CSS entrance animation.
        void giftStage.offsetWidth;
        giftStage.classList.add("is-active");
        giftSkip.focus({ preventScroll: true });
        if (!prefersReducedMotion && giftContext) giftFrame = requestAnimationFrame(drawGift);
        // Use the 3D heart if the library is ready (or arrives within ~2s); otherwise keep the SVG heart.
        if (THREE) start3D();
        else threePromise.then(() => {
          if (!giftStage.hidden && performance.now() - giftStartedAt < 2000) start3D();
        });
        giftTimer = setTimeout(finishGift, prefersReducedMotion ? 1800 : 6700);
      };

      giftSkip.addEventListener("click", finishGift);
      giftReplay.addEventListener("click", () => playGift());
      giftStage.addEventListener("keydown", (event) => {
        if (event.key === "Escape") finishGift();
        if (event.key === "Tab") { event.preventDefault(); giftSkip.focus(); }
      });

      confirmBtn.addEventListener("click", () => {
        if (hasStarted) return;
        hasStarted = true;
        confirmBtn.disabled = true;
        hideModal();
        startBgm();
        playGift(() => {
          createFloatingHearts();
          startHeart();
        });
      });

      musicToggle.addEventListener("click", () => {
        if (!bgm) return;
        if (bgm.paused) {
          musicEnabled = true;
          bgm.play().catch(() => {
            musicEnabled = false;
            syncMusicButton();
          });
        } else {
          musicEnabled = false;
          bgm.pause();
        }
        syncMusicButton();
      });

      document.addEventListener("visibilitychange", () => {
        if (!hasStarted || !bgm) return;
        if (document.hidden) {
          bgm.pause();
          return;
        }
        if (musicEnabled) bgm.play().catch(() => {});
      });

      // ---------- Finale: fireworks -> title + counter -> letter -> question -> celebration ----------
      const MEET_DATE = new Date(2025, 7, 14, 0, 0, 0);
      const LETTER = `怡宝

你说你会算
还自诩为神婆

每天都觉得特别的开心
和你一起猜星座
和你一起骂领导

和你一起去看爆笑的脱口秀
去看令人落泪的十二封信

      const finale = document.getElementById("finale");
      const fxCanvas = document.getElementById("finaleFx");
      const rainCanvas = document.getElementById("finaleRain");
      const fxCtx = fxCanvas.getContext("2d");
      const rainCtx = rainCanvas.getContext("2d");
      const finaleSmall = document.getElementById("finaleSmall");
      const finaleH1 = document.getElementById("finaleH1");
      const finaleCount = document.getElementById("finaleCount");
      const openLetterBtn = document.getElementById("openLetter");
      const finaleAgain = document.getElementById("finaleAgain");
      const letterLayer = document.getElementById("finaleLetter");
      const envelope = document.getElementById("envelope");
      const paper = document.getElementById("paper");
      const paperTip = document.getElementById("paperTip");
      const paperText = document.getElementById("paperText");
      const ask = document.getElementById("ask");
      const askBtns = document.getElementById("askBtns");
      const askYes = document.getElementById("askYes");
      const askNo = document.getElementById("askNo");

      const PHOTO_FILES = [
        "2025083001", "2025091401", "2025092701", "2025100801", "2025102501", "2025112301", "2025112302",
        "2025120101", "2025120501", "2025120502", "2026010301", "2026010302", "2026010303", "2026010304",
        "2026010401", "2026021301", "2026021401", "2026021601", "2026041801", "2026041802",
      ];
      const photoSrc = (name) => `./assets/photos/${name}.jpg`;
      const photoDate = (name) => `${name.slice(0, 4)}.${name.slice(4, 6)}.${name.slice(6, 8)}`;
      const photoWall = document.getElementById("photoWall");
      const wallGrid = document.getElementById("wallGrid");
      const lightbox = document.getElementById("lightbox");
      const lbImg = document.getElementById("lbImg");
      const lbCap = document.getElementById("lbCap");
      let photoPreloaded = false;
      const preloadPhotos = () => {
        if (photoPreloaded) return;
        photoPreloaded = true;
        // Warm the cache one by one while the letter is being typed.
        PHOTO_FILES.reduce((chain, name) => chain.then(() => new Promise((resolve) => {
          const img = new Image();
          img.onload = img.onerror = resolve;
          img.src = photoSrc(name);
        })), Promise.resolve());
      };

      // Lightbox: original-proportion photo; arrows / swipe / keyboard to browse.
      let lbIndex = 0;
      let lbOpener = null;
      const lbShow = (index) => {
        lbIndex = (index + PHOTO_FILES.length) % PHOTO_FILES.length;
        const name = PHOTO_FILES[lbIndex];
        lbImg.src = photoSrc(name);
        lbImg.alt = `${photoDate(name)} 的照片`;
        lbCap.textContent = `${photoDate(name)}  ·  ${lbIndex + 1} / ${PHOTO_FILES.length}`;
        [lbIndex + 1, lbIndex - 1].forEach((i) => {
          new Image().src = photoSrc(PHOTO_FILES[(i + PHOTO_FILES.length) % PHOTO_FILES.length]);
        });
      };
      const lbOpen = (index, opener) => {
        lbOpener = opener || null;
        lbShow(index);
        lightbox.hidden = false;
        void lightbox.offsetWidth;
        lightbox.classList.add("is-on");
        document.getElementById("lbClose").focus({ preventScroll: true });
      };
      const lbClose = () => {
        if (lightbox.hidden) return;
        lightbox.classList.remove("is-on");
        setTimeout(() => { lightbox.hidden = true; lbImg.removeAttribute("src"); }, prefersReducedMotion ? 0 : 300);
        if (lbOpener) lbOpener.focus({ preventScroll: true });
      };
      document.getElementById("lbClose").addEventListener("click", lbClose);
      document.getElementById("lbPrev").addEventListener("click", () => lbShow(lbIndex - 1));
      document.getElementById("lbNext").addEventListener("click", () => lbShow(lbIndex + 1));
      lightbox.addEventListener("click", (event) => {
        // Clicking the dark backdrop (not the photo or the buttons) closes the viewer.
        if (event.target === lightbox) lbClose();
      });
      document.addEventListener("keydown", (event) => {
        if (lightbox.hidden) return;
        if (event.key === "Escape") lbClose();
        else if (event.key === "ArrowLeft") lbShow(lbIndex - 1);
        else if (event.key === "ArrowRight") lbShow(lbIndex + 1);
      });
      let swipeX = null;
      lightbox.addEventListener("pointerdown", (event) => { swipeX = event.clientX; });
      lightbox.addEventListener("pointerup", (event) => {
        if (swipeX === null) return;
        const dx = event.clientX - swipeX;
        swipeX = null;
        if (Math.abs(dx) > 50) lbShow(lbIndex + (dx < 0 ? 1 : -1));
      });

      // Photo wall: natural aspect ratios in a masonry layout, items fade in as they scroll into view.
      let wallBuilt = false;
      const buildWall = () => {
        if (wallBuilt) return;
        wallBuilt = true;
        const observer = "IntersectionObserver" in window
          ? new IntersectionObserver((entries) => entries.forEach((entry) => {
              if (entry.isIntersecting) { entry.target.classList.add("is-in"); observer.unobserve(entry.target); }
            }), { root: finale, rootMargin: "0px 0px -6% 0px", threshold: 0.05 })
          : null;
        const fragment = document.createDocumentFragment();
        PHOTO_FILES.forEach((name, index) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "wall-item";
          item.setAttribute("aria-label", `放大查看 ${photoDate(name)} 的照片`);
          item.style.setProperty("--r", `${randomRange(-2.2, 2.2).toFixed(1)}deg`);
          item.style.setProperty("--d", `${(index % 4) * 0.08}s`);
          const img = document.createElement("img");
          img.src = photoSrc(name);
          img.alt = "";
          img.decoding = "async";
          const cap = document.createElement("span");
          cap.textContent = photoDate(name);
          item.append(img, cap);
          item.addEventListener("click", () => lbOpen(index, item));
          fragment.appendChild(item);
        });
        wallGrid.appendChild(fragment);
        photoWall.hidden = false;
        wallGrid.querySelectorAll(".wall-item").forEach((item) => (observer ? observer.observe(item) : item.classList.add("is-in")));
      };

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const FX_PALETTES = [
        ["#ffe5ae", "#ff9dce", "#fff4e2"],
        ["#ff7ab8", "#ffc2dd", "#ffffff"],
        ["#ffd36e", "#ffb199", "#fff3c9"],
        ["#d9a6ff", "#ff9dce", "#ffe9f3"],
      ];
      const heartPath = new Path2D();
      for (let i = 0; i <= 60; i += 1) {
        const p = heartPointAt((i / 60) * Math.PI * 2);
        if (i) heartPath.lineTo(p.x / 17, p.y / 17); else heartPath.moveTo(p.x / 17, p.y / 17);
      }
      heartPath.closePath();

      let finaleStarted = false;
      let accepted = false;
      let fxW = 0, fxH = 0, fxLast = 0, fxFrame = null, fxRainOn = false, fxAuto = null;
      let fxParts = [];
      let fxRain = [];

      const fxResize = () => {
        fxW = window.innerWidth;
        fxH = window.innerHeight;
        const ratio = Math.min(window.devicePixelRatio || 1, fxW < 600 ? 1.5 : 2);
        [fxCanvas, rainCanvas].forEach((canvas) => {
          canvas.width = Math.round(fxW * ratio);
          canvas.height = Math.round(fxH * ratio);
        });
        fxCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
        rainCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
      };

      const fxBurst = (x, y, heart) => {
        if (prefersReducedMotion || fxParts.length > 1100) return;
        const small = fxW < 600;
        const count = heart ? (small ? 110 : 170) : (small ? 70 : 110);
        const palette = pick(FX_PALETTES);
        const radius = Math.min(fxW, fxH) * (heart ? 0.2 : randomRange(0.14, 0.24));
        const drag = 2.2;
        for (let i = 0; i < count; i += 1) {
          let vx, vy;
          if (heart) {
            const p = heartPointAt((i / count) * Math.PI * 2);
            const k = (radius * drag) / 16 * randomRange(0.97, 1.03);
            vx = p.x * k; vy = p.y * k;
          } else {
            const a = Math.random() * Math.PI * 2;
            const sp = radius * drag * Math.sqrt(Math.random());
            vx = Math.cos(a) * sp; vy = Math.sin(a) * sp;
          }
          fxParts.push({ x, y, vx, vy, life: 0, max: randomRange(1.4, 2.1), drag,
            size: randomRange(1.2, 2.6), color: pick(palette) });
        }
      };

      const fxRandomBurst = () => {
        fxBurst(randomRange(fxW * 0.12, fxW * 0.88), randomRange(fxH * 0.15, fxH * 0.55), Math.random() < 0.5);
      };

      const fxLoop = (now) => {
        const dt = Math.min((now - fxLast) / 1000 || 0.016, 0.04);
        fxLast = now;
        fxCtx.globalCompositeOperation = "destination-out";
        fxCtx.fillStyle = "rgba(0,0,0,0.25)";
        fxCtx.fillRect(0, 0, fxW, fxH);
        fxCtx.globalCompositeOperation = "lighter";
        fxParts = fxParts.filter((q) => q.life < q.max);
        for (const q of fxParts) {
          q.life += dt;
          const damp = Math.exp(-q.drag * dt);
          q.vx *= damp; q.vy = q.vy * damp + 60 * dt;
          q.x += q.vx * dt; q.y += q.vy * dt;
          fxCtx.globalAlpha = Math.max(0, 1 - q.life / q.max);
          fxCtx.fillStyle = q.color;
          fxCtx.beginPath(); fxCtx.arc(q.x, q.y, q.size, 0, Math.PI * 2); fxCtx.fill();
        }
        fxCtx.globalAlpha = 1;

        rainCtx.clearRect(0, 0, fxW, fxH);
        if (fxRainOn && fxRain.length < (fxW < 600 ? 28 : 48) && Math.random() < dt * 12) {
          fxRain.push({ x: Math.random() * fxW, y: -20, s: randomRange(7, 20), vy: randomRange(50, 110),
            sway: randomRange(10, 30), phase: Math.random() * 6.28, rot: randomRange(-0.5, 0.5),
            alpha: randomRange(0.45, 0.9), color: pick(["#ff7ab8", "#ff9dce", "#ffc2dd", "#ffd3a6", "#ff5c9a"]) });
        }
        fxRain = fxRain.filter((h) => h.y < fxH + 30);
        for (const h of fxRain) {
          h.y += h.vy * dt; h.phase += dt * 1.6;
          rainCtx.save();
          rainCtx.translate(h.x + Math.sin(h.phase) * h.sway, h.y);
          rainCtx.rotate(h.rot + Math.sin(h.phase) * 0.25);
          rainCtx.scale(h.s, h.s);
          rainCtx.globalAlpha = h.alpha;
          rainCtx.fillStyle = h.color;
          rainCtx.fill(heartPath);
          rainCtx.restore();
        }
        fxFrame = requestAnimationFrame(fxLoop);
      };

      const tickCount = () => {
        const total = Math.max(0, Math.floor((Date.now() - MEET_DATE.getTime()) / 1000));
        const days = Math.floor(total / 86400);
        const pad = (n) => String(n).padStart(2, "0");
        const h = pad(Math.floor((total % 86400) / 3600));
        const m = pad(Math.floor((total % 3600) / 60));
        const s = pad(total % 60);
        finaleCount.innerHTML = `${accepted ? "我们的故事已经写了" : "遇见你已经"} <b>${days}</b> 天 ${h} 时 ${m} 分 ${s} 秒`;
      };

      const startFinale = () => {
        if (finaleStarted) return;
        finaleStarted = true;
        stageHint.classList.remove("is-visible");
        giftReplay.hidden = true;
        Array.from(cardsContainer.children).forEach((popup) => {
          popup.style.transition = "opacity .6s ease, transform .6s ease";
          popup.style.opacity = "0";
          popup.style.transform = "scale(1.7) rotate(0deg)";
        });
        setTimeout(() => { cardsContainer.textContent = ""; }, 900);

        finale.hidden = false;
        fxResize();
        window.addEventListener("resize", fxResize);
        void finale.offsetWidth;
        finale.classList.add("is-active");
        fxLast = performance.now();
        fxFrame = requestAnimationFrame(fxLoop);
        tickCount();
        setInterval(tickCount, 1000);

        [[200, 0.5, 0.4, true], [1000, 0.25, 0.3, false], [1400, 0.75, 0.28, false], [2100, 0.3, 0.5, true],
          [2500, 0.7, 0.5, true], [3200, 0.5, 0.25, false], [3600, 0.2, 0.35, false], [3900, 0.8, 0.35, false],
        ].forEach(([delay, xr, yr, heart]) => setTimeout(() => fxBurst(fxW * xr, fxH * yr, heart), delay));
        setTimeout(() => finale.classList.add("show-title"), 3000);
        setTimeout(() => { openLetterBtn.disabled = false; finale.classList.add("show-btn"); }, 5800);
      };

      // Tap anywhere to launch a firework.
      finale.addEventListener("pointerdown", (event) => {
        if (!letterLayer.hidden || event.target.closest("button")) return;
        fxBurst(event.clientX, event.clientY, Math.random() < 0.5);
      });
      finaleAgain.addEventListener("click", () => location.reload());

      // Typewriter: tapping the paper speeds it up.
      let typeBoost = 1;
      paper.addEventListener("pointerdown", () => { typeBoost = 6; });
      const typeLetter = async () => {
        if (prefersReducedMotion) { paperText.textContent = LETTER; return; }
        paperText.classList.add("is-typing");
        let text = "";
        for (const ch of LETTER) {
          text += ch;
          paperText.textContent = text;
          paper.scrollTop = paper.scrollHeight;
          const base = ch === "\n" ? 240 : /[，。 ]/.test(ch) ? 110 : 62;
          await wait(Math.max(8, base / typeBoost));
        }
        paperText.classList.remove("is-typing");
      };

      openLetterBtn.addEventListener("click", async () => {
        openLetterBtn.disabled = true;
        preloadPhotos(); // the letter takes a while to type; warm up the photos meanwhile
        finale.classList.remove("show-btn");
        letterLayer.hidden = false;
        void letterLayer.offsetWidth;
        letterLayer.classList.add("is-on");
        await wait(500);
        envelope.classList.add("is-open");
        await wait(1100);
        envelope.classList.add("is-gone");
        paper.classList.add("is-on");
        await wait(900);
        await typeLetter();
        paperTip.hidden = true;
        ask.hidden = false;
        paper.scrollTo({ top: paper.scrollHeight, behavior: "smooth" });
      });

      // The "再想想" button runs away a few times, then gives in.
      let dodges = 0;
      const dodgeNo = () => {
        if (accepted) return;
        dodges += 1;
        askYes.style.transform = `scale(${Math.min(1 + dodges * 0.12, 1.6)})`;
        if (dodges > 5) {
          askNo.classList.remove("is-dodging");
          askNo.style.left = askNo.style.top = "";
          askNo.textContent = "好吧，答应你 ♡";
          askNo.dataset.giveUp = "1";
          return;
        }
        const box = askBtns.getBoundingClientRect();
        const btn = askNo.getBoundingClientRect();
        askNo.classList.add("is-dodging");
        askNo.style.left = `${randomRange(0, Math.max(0, box.width - btn.width))}px`;
        askNo.style.top = `${randomRange(0, Math.max(0, box.height - btn.height))}px`;
      };
      askNo.addEventListener("pointerenter", () => { if (!askNo.dataset.giveUp) dodgeNo(); });
      askNo.addEventListener("click", () => {
        if (askNo.dataset.giveUp) acceptAnswer();
        else dodgeNo();
      });
      askYes.addEventListener("click", () => acceptAnswer());

      const acceptAnswer = () => {
        if (accepted) return;
        accepted = true;
        letterLayer.classList.remove("is-on");
        setTimeout(() => { letterLayer.hidden = true; }, 700);
        finale.classList.add("is-final", "show-title");
        finale.classList.remove("show-btn");
        finaleSmall.textContent = "FOREVER & ALWAYS";
        finaleH1.textContent = "把每一次日出都过成纪念日";
        finale.scrollTop = 0;
        setTimeout(buildWall, prefersReducedMotion ? 0 : 1500);
        tickCount();
        fxRainOn = !prefersReducedMotion;
        for (let i = 0; i < 7; i += 1) setTimeout(() => (i % 2 ? fxRandomBurst() : fxBurst(fxW / 2, fxH * 0.35, true)), i * 280);
        fxAuto = setInterval(() => { if (!document.hidden) fxRandomBurst(); }, 1500);
      };

      confirmBtn.focus();
    </script>
  </body>
