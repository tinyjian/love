    <style>
      :root {
        color-scheme: light;
        --bg-color: #fbe3ea;
        --card-font: "PingFang SC", "Microsoft YaHei", sans-serif;
        --safe-right: max(16px, env(safe-area-inset-right));
        --safe-bottom: max(16px, env(safe-area-inset-bottom));
        --safe-top: max(18px, env(safe-area-inset-top));
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: var(--card-font);
        background-color: var(--bg-color);
        background-image: linear-gradient(165deg, #ffeff3 0%, #ffd1e0 35%, #fbc2eb 100%);
      }

      body::before {
        content: "";
        position: absolute;
        inset: -10%;
        background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.92), transparent 55%),
          radial-gradient(circle at 80% 30%, rgba(255, 179, 214, 0.55), transparent 60%),
          radial-gradient(circle at 50% 85%, rgba(255, 200, 223, 0.5), transparent 65%);
        z-index: 0;
        pointer-events: none;
      }

      .floating-hearts {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .heart {
        position: absolute;
        bottom: -8%;
        color: #ff6b9c;
        font-size: 24px;
        opacity: 0;
        animation: float var(--dur, 6.4s) ease-in-out var(--delay, 0s) infinite;
      }

      @keyframes float {
        0% {
          opacity: 0;
          transform: translate3d(0, 20vh, 0) scale(0.6) rotate(0deg);
        }
        15%,
        80% {
          opacity: 0.85;
        }
        100% {
          opacity: 0;
          transform: translate3d(0, -110vh, 0) scale(1.12) rotate(360deg);
        }
      }

      .experience {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        z-index: 2;
      }

      .stage-hint {
        position: absolute;
        top: var(--safe-top);
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        width: min(520px, calc(100% - 32px));
        text-align: center;
        color: #c45d7a;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
        pointer-events: none;
        opacity: 0;
        transition: opacity 480ms ease;
      }

      .stage-hint.is-visible {
        opacity: 1;
      }

      .stage-hint strong {
        display: block;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.12em;
      }

      .stage-hint span {
        display: block;
        margin-top: 6px;
        font-size: 13px;
        opacity: 0.78;
      }

      .cards {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }

      .popup {
        position: absolute;
        left: 0;
        top: 0;
        width: 148px;
        height: 64px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid rgba(255, 164, 194, 0.45);
        box-shadow: 0 6px 18px rgba(255, 105, 135, 0.28);
        font-size: 12px;
        line-height: 1.3;
        user-select: none;
        transform-origin: center;
        opacity: 0;
      }

      .popup-header {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 6px;
        background: #fce4ec;
        border-bottom: 1px solid #f8bbd0;
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 700;
        color: #d4537a;
        white-space: nowrap;
      }

      .popup-body {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3px 6px;
        text-align: center;
        font-weight: 700;
        color: #6d3348;
        overflow: hidden;
      }

      .popup-body span {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        text-overflow: ellipsis;
        word-break: break-word;
        line-height: 1.25;
        max-height: 2.5em;
      }

      .popup.theme-pink .popup-header {
        background: #fce4ec;
      }
      .popup.theme-pink .popup-body {
        background: #fff5f8;
      }
      .popup.theme-rose .popup-header {
        background: #ffe4e8;
      }
      .popup.theme-rose .popup-body {
        background: #fff7f8;
      }
      .popup.theme-lavender .popup-header {
        background: #f3e5f5;
      }
      .popup.theme-lavender .popup-body {
        background: #faf5fc;
      }
      .popup.theme-peach .popup-header {
        background: #ffe8dc;
      }
      .popup.theme-peach .popup-body {
        background: #fff8f3;
      }
      .popup.theme-coral .popup-header {
        background: #ffddd8;
      }
      .popup.theme-coral .popup-body {
        background: #fff6f5;
      }

      @keyframes heart-fly-in {
        0% {
          opacity: 0;
          left: var(--start-left);
          top: var(--final-top);
          transform: scale(0.35) rotate(var(--rotation, 0deg));
        }
        22% {
          opacity: 1;
          left: var(--final-left);
          top: var(--final-top);
          transform: scale(1.16) rotate(var(--rotation, 0deg));
        }
        72% {
          opacity: 1;
          left: var(--final-left);
          top: var(--final-top);
          transform: scale(1.16) rotate(var(--rotation, 0deg));
        }
        100% {
          opacity: 1;
          left: var(--final-left);
          top: var(--final-top);
          transform: scale(1) rotate(var(--rotation, 0deg));
        }
      }

      .popup.heart-anim {
        animation: heart-fly-in 3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(255, 154, 185, 0.32);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(6px);
        z-index: 10;
        opacity: 1;
        transition: opacity 320ms ease;
      }

      .modal-backdrop.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .modal {
        width: min(420px, 80vw);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 36px 90px rgba(255, 110, 170, 0.25);
        padding: 28px 32px 24px;

        flex-direction: column;
        gap: 16px;

        gap: 12px;

        border-radius: 12px;
        background: linear-gradient(135deg, #ff6b9c, #ff8fab);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 20px;

      .modal-title {

        color: #7a3a52;
      }

      .modal-body {

      }

      .modal-actions {

        justify-content: flex-end;
        margin-top: 12px;

        border: none;
        cursor: pointer;
        color: #fff;
        touch-action: manipulation;
        background: linear-gradient(135deg, #ff6b9c, #ff8fab);

      .btn-primary {
        padding: 10px 22px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 500;

      .btn-primary:hover {
        transform: translateY(-1px);

      .btn-primary:active {

      }

      .btn-primary:focus-visible,

        outline-offset: 3px;

      .music-toggle {
        position: fixed;
        right: var(--safe-right);
        bottom: var(--safe-bottom);
        z-index: 20;
        width: 44px;
        height: 44px;
        border-radius: 50%;

        }
        .popup-header {

        }
        .popup-body {

        .heart {
          animation: none;
          display: none;
        }
        .popup.heart-anim {
          animation: none;
          opacity: 1;
          left: var(--final-left);
          top: var(--final-top);
          transform: rotate(var(--rotation, 0deg));
        }
      }
    </style>
  </head>

        modalFade: 320,
        spawnGap: 170,
        flyDuration: 3000,
        heartHold: 3500,
        gatherGap: 6,
        scatterGap: 8,
      };

      const THEMES = ["theme-pink", "theme-rose", "theme-lavender", "theme-peach", "theme-coral"];

      const modal = document.getElementById("modal");

      const cardsContainer = document.getElementById("cards");

      const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      let prefersReducedMotion = motionQuery.matches;
      const onMotionChange = (event) => {
        prefersReducedMotion = event.matches;
      };
      if (typeof motionQuery.addEventListener === "function") {
        motionQuery.addEventListener("change", onMotionChange);
      } else if (typeof motionQuery.addListener === "function") {
        motionQuery.addListener(onMotionChange);
      }

      let hasStarted = false;
      let musicEnabled = true;
      let spawnTimer = null;
      let spawnIndex = 0;
      let selectedPhrases = [];
      let heartPoints = [];
      const heartEmojis = ["💖", "💕", "💗", "💝", "💘"];

      const randomRange = (min, max) => Math.random() * (max - min) + min;
      const pick = (list) => list[Math.floor(Math.random() * list.length)];
      const loveScore = (str) => (str.includes("我爱你") ? 2 : str.includes("我喜欢你") ? 1 : 0);
      const displayText = (text) => text.replace(/^怡宝，/, "");

      const setHint = (text) => {
        if (stageHintText) stageHintText.textContent = text;
        if (stageHint) stageHint.classList.add("is-visible");
      };

      const getPopupSize = () => {
        const w = window.innerWidth;
        if (w <= 375) return { w: 102, h: 52 };
        if (w <= 480) return { w: 118, h: 56 };
        if (w <= 640) return { w: 132, h: 58 };
        if (w <= 768) return { w: 148, h: 64 };
        if (w <= 1024) return { w: 158, h: 66 };
        return { w: 176, h: 70 };
      };

      const getPhraseLimit = () => {
        const minSide = Math.min(window.innerWidth, window.innerHeight);
        if (minSide < 520) return 42;
        if (minSide < 800) return 64;
        return phrases.length;
      };

      const pickPhrases = (limit) => {
        const scored = phrases.map((text) => ({
          text,
          score: loveScore(text),
          rand: Math.random(),
        }));
        scored.sort((a, b) => b.score - a.score || a.rand - b.rand);
        return scored.slice(0, limit).map((item) => item.text);
      };

      const heartPointAt = (t) => {
        const sinT = Math.sin(t);
        return {
          x: 16 * sinT * sinT * sinT,
          y: -(
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t)
          ),
        };
      };

      const generateHeartPoints = (count) => {
        const sampleCount = Math.max(count * 8, 720);
        const samples = new Array(sampleCount);
        let totalLength = 0;
        let prev = null;

        for (let i = 0; i < sampleCount; i += 1) {
          const t = (i / (sampleCount - 1)) * Math.PI * 2;
          const point = heartPointAt(t);
          if (prev) totalLength += Math.hypot(point.x - prev.x, point.y - prev.y);
          samples[i] = { x: point.x, y: point.y, length: totalLength };
          prev = point;
        }

        if (count <= 1) {
          const mid = samples[Math.floor(samples.length / 2)];
          return [{ x: mid.x, y: mid.y }];
        }

        const points = new Array(count);
        const segmentLength = totalLength / count;
        let sampleIndex = 1;

        for (let i = 0; i < count; i += 1) {
          const targetLength = segmentLength * i;
          while (sampleIndex < samples.length && samples[sampleIndex].length < targetLength) {
            sampleIndex += 1;
          }

          const prevSample = samples[Math.max(0, sampleIndex - 1)];
          const nextSample = samples[Math.min(samples.length - 1, sampleIndex)];
          const span = nextSample.length - prevSample.length || 1;
          const ratio = Math.min(Math.max((targetLength - prevSample.length) / span, 0), 1);

          points[i] = {
            x: prevSample.x + (nextSample.x - prevSample.x) * ratio,
            y: prevSample.y + (nextSample.y - prevSample.y) * ratio,
          };
        }

        return points;
      };

        const pad = 40;
        const scale = Math.min((width - pad * 2) / 32, (height - pad * 2) / 34) * 0.92;
        const finalLeft = width / 2 + point.x * scale - size.w / 2;
        const finalTop = height / 2 + point.y * scale - size.h / 2 + 18;
        const fromRight = point.x >= 0;
        const startLeft = fromRight ? width + 80 : -size.w - 80;
        return { size, finalLeft, finalTop, startLeft };
      };

      const createFloatingHearts = () => {
        if (prefersReducedMotion) return;
        const count = window.innerWidth < 768 ? 5 : 8;
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i += 1) {
          const heart = document.createElement("div");
          heart.className = "heart";
          heart.textContent = heartEmojis[i % heartEmojis.length];
          heart.style.left = `${8 + ((i * 17) % 84)}%`;
          heart.style.setProperty("--delay", `${(i * 0.65).toFixed(2)}s`);
          heart.style.setProperty("--dur", `${5.8 + (i % 4) * 0.6}s`);
          heart.style.fontSize = `${20 + (i % 5) * 4}px`;
          fragment.appendChild(heart);
        }
        floatingHearts.appendChild(fragment);
      };

      const syncMusicButton = () => {
        musicToggle.setAttribute("aria-pressed", musicEnabled ? "false" : "true");
        musicToggle.setAttribute("aria-label", musicEnabled ? "关闭音乐" : "开启音乐");
        musicToggle.textContent = musicEnabled ? "♪" : "🔇";
      };

      const startBgm = () => {
        if (!bgm) return;
        bgm.volume = 0.6;
        musicToggle.hidden = false;
        const playPromise = bgm.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise
            .then(() => {
              musicEnabled = true;
              syncMusicButton();
            })
            .catch(() => {
              musicEnabled = false;
              syncMusicButton();
            });
        } else {
          syncMusicButton();
        }
      };

      const hideModal = () => {
        const removeModal = () => {
          if (modal && modal.parentNode) modal.remove();
        };
        modal.classList.add("is-leaving");
        modal.addEventListener("transitionend", removeModal, { once: true });
        setTimeout(removeModal, TIMING.modalFade + 80);
      };

      const spawnPopup = (index) => {
        const text = displayText(selectedPhrases[index]);
        const layout = getHeartLayout(heartPoints[index]);
        const rotation = `${randomRange(-3, 3).toFixed(1)}deg`;
        const popup = document.createElement("div");
        popup.className = `popup ${pick(THEMES)} heart-anim`;
        popup.style.zIndex = String(100 + index);
        popup.style.setProperty("--start-left", `${layout.startLeft}px`);
        popup.style.setProperty("--final-left", `${layout.finalLeft}px`);
        popup.style.setProperty("--final-top", `${layout.finalTop}px`);
        popup.style.setProperty("--rotation", rotation);

        const header = document.createElement("div");
        header.className = "popup-header";
        const icon = document.createElement("span");
        icon.textContent = "💝";
        const title = document.createElement("span");
        title.textContent = "给怡宝的话";
        header.append(icon, title);

        const body = document.createElement("div");
        body.className = "popup-body";
        const line = document.createElement("span");
        line.textContent = text;
        body.appendChild(line);

        popup.append(header, body);
        cardsContainer.appendChild(popup);
      };

      const freezePopup = (popup) => {
        const style = window.getComputedStyle(popup);
        popup.style.animation = "none";
        popup.style.opacity = "1";
        popup.style.left = style.left;
        popup.style.top = style.top;
        popup.style.transform = style.transform;
      };

      const gatherThenScatter = () => {
        const popups = Array.from(cardsContainer.children);
        const { innerWidth: width, innerHeight: height } = window;
        const size = getPopupSize();
        const centerLeft = width / 2 - size.w / 2;
        const centerTop = height / 2 - size.h / 2;

        setHint("先收进心里，再轻轻散开");
        popups.forEach((popup, index) => {
          setTimeout(() => {
            freezePopup(popup);
            popup.style.transition = "all 1s cubic-bezier(0.4, 0, 0.2, 1)";
            popup.style.left = `${centerLeft}px`;
            popup.style.top = `${centerTop}px`;
            popup.style.zIndex = String(1000 + index);
            popup.style.transform = "scale(1) rotate(0deg)";
          }, index * TIMING.gatherGap);
        });

        const scatterAt = popups.length * TIMING.gatherGap + 1100;
        setTimeout(() => {
          setHint("每一句都想被你看见");
          popups.forEach((popup, index) => {
            setTimeout(() => {
              const left = Math.random() * (width + 80) - 40;
              const top = Math.random() * (height + 80) - 40;
              const scale = 1.12 + Math.random() * 0.5;
              const rot = randomRange(-14, 14);
              popup.style.transition = "all 1.5s cubic-bezier(0.34, 1.56, 0.64, 1)";
              popup.style.left = `${left}px`;
              popup.style.top = `${top}px`;
              popup.style.transform = `scale(${scale.toFixed(2)}) rotate(${rot.toFixed(1)}deg)`;
              popup.style.boxShadow = "0 2px 8px rgba(255,105,135,0.4)";
            }, index * TIMING.scatterGap);
          });
        }, scatterAt);
      };

      const startHeart = () => {
        selectedPhrases = pickPhrases(getPhraseLimit());
        heartPoints = generateHeartPoints(selectedPhrases.length);
        spawnIndex = 0;
        setHint("从最上边开始，一句一句拼成心");

        if (prefersReducedMotion) {
          selectedPhrases.forEach((_, index) => spawnPopup(index));
          return;
        }

        spawnTimer = setInterval(() => {
          spawnPopup(spawnIndex);
          spawnIndex += 1;
          if (spawnIndex >= selectedPhrases.length) {
            clearInterval(spawnTimer);
            spawnTimer = null;
            setTimeout(gatherThenScatter, TIMING.flyDuration + TIMING.heartHold);
          }
        }, TIMING.spawnGap);
      };

      confirmBtn.addEventListener("click", () => {
        if (hasStarted) return;
        hasStarted = true;
        confirmBtn.disabled = true;
        hideModal();
        setTimeout(() => {
          createFloatingHearts();
          startBgm();
          startHeart();
        }, 120);
      });

      musicToggle.addEventListener("click", () => {
        if (!bgm) return;
        if (bgm.paused) {
          musicEnabled = true;
          bgm.play().catch(() => {
            musicEnabled = false;
            syncMusicButton();
          });
        } else {
          musicEnabled = false;
          bgm.pause();
        }
        syncMusicButton();
      });

      document.addEventListener("visibilitychange", () => {
        if (!hasStarted || !bgm) return;
        if (document.hidden) {
          bgm.pause();
          return;
        }
        if (musicEnabled) bgm.play().catch(() => {});
      });

      confirmBtn.focus();
    </script>
  </body>
</html>
